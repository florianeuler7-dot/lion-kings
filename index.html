<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="LION KINGS – Trainings-Agent für die Crew" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- iOS -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LION KINGS" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Tailwind via CDN (simpler deployment) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <title>LION KINGS</title>

    <style>
      html, body, #root { height: 100%; background: #0a0a0a; overflow-x: hidden; }
      body {
        font-family: 'DM Sans', sans-serif;
        color: #f5f5f5;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-overflow-scrolling: touch;
      }
      .font-display { font-family: 'Anton', sans-serif; letter-spacing: 0.02em; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      .font-body { font-family: 'DM Sans', sans-serif; }
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="number"] { -moz-appearance: textfield; }
      .grain::before {
        content: '';
        position: fixed; inset: 0; pointer-events: none; z-index: 1;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
        opacity: 0.03;
      }
      /* Hide scrollbars but keep scrollability */
      ::-webkit-scrollbar { width: 0; height: 0; display: none; }
      * { scrollbar-width: none; -ms-overflow-style: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
      /* iOS safe area */
      .safe-top { padding-top: env(safe-area-inset-top); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
      /* Nav & coach layout */
      :root { --nav-h: calc(3.75rem + env(safe-area-inset-bottom, 0px)); }
      .app-nav {
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
        background: #18181b;
        border-top: 1px solid #27272a;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      /* Always fill the gap below the nav on iOS PWA */
      body::after {
        content: '';
        position: fixed;
        bottom: 0; left: 0; right: 0;
        height: 60px;
        background: #18181b;
        z-index: 19;
        pointer-events: none;
      }
      .coach-screen {
        position: fixed; top: 0; left: 0; right: 0;
        bottom: var(--nav-h);
        display: flex; flex-direction: column;
        overflow: hidden;
        background: #09090b;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
