<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="WinterArc 26/27 – Trainings-App für die Crew" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=4" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=4" />

    <!-- iOS standalone / home screen -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WinterArc" />

    <!-- Fonts: Barlow Condensed (display) / Barlow (body) / JetBrains Mono (timers, data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

    <title>WinterArc 26/27</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if (navigator.serviceWorker) {
        // A device that still runs an old service worker shows the stale, cached app once.
        // When the new worker takes over, reload so the fresh version appears right away.
        const hadController = !!navigator.serviceWorker.controller;
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!hadController || refreshing) return;
          refreshing = true;
          location.reload();
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => reg.update().catch(() => {}))
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
