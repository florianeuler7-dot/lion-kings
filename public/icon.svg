<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    WinterArc app icon: white geometric "ARC" on black. Nothing else.
    Letters are paths (no font dependency). scripts/generate-icons.mjs renders the PNGs;
    <g id="art"> is what the maskable variant scales into the safe zone.
  -->
  <rect id="bg" width="512" height="512" rx="112" fill="#000000"/>

  <g id="art">
    <!-- monoline letters, stroke 32, centered -->
    <g fill="none" stroke="#ffffff" stroke-width="32" stroke-linejoin="miter" stroke-miterlimit="6" transform="translate(0 -67)">
      <!-- A -->
      <path d="M86 400 L125 262 H135 L174 400"/>
      <path d="M106 352 H154"/>
      <!-- R -->
      <path d="M220 400 V262 H262 A32 32 0 0 1 262 326 H220"/>
      <path d="M258 326 L296 400"/>
      <!-- C -->
      <path d="M424.5 276.4 A61.5 61.5 0 1 0 424.5 370.6"/>
    </g>
  </g>
</svg>
