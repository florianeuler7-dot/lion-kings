<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    WinterArc app icon: a glowing progress arc (orange → ice) over a geometric "ARC" wordmark.
    Letters are drawn as paths, not text, so the render never depends on installed fonts.
    scripts/generate-icons.mjs renders the PNGs; the <g id="art"> group is what the
    maskable variant scales down.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172a4a"/>
      <stop offset="0.55" stop-color="#0c1528"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#f97316" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset="0.45" stop-color="#fb923c"/>
      <stop offset="0.8" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="letters" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect id="bg" width="512" height="512" rx="112" fill="url(#bg)"/>

  <g id="art">
    <rect width="512" height="512" fill="url(#halo)"/>

    <!-- faint track the arc runs on -->
    <path d="M63 230 A205 205 0 0 1 449 230" fill="none" stroke="#7dd3fc" stroke-opacity="0.14" stroke-width="4" stroke-linecap="round"/>
    <path d="M56 262 A222 222 0 0 1 456 262" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

    <!-- the arc: orange energy running into ice -->
    <path d="M63 230 A205 205 0 0 1 449 230" fill="none" stroke="url(#arc)" stroke-width="24" stroke-linecap="round" filter="url(#glow)"/>
    <!-- progress head -->
    <circle cx="449" cy="230" r="17" fill="#e0f2fe" filter="url(#softglow)"/>
    <circle cx="449" cy="230" r="8" fill="#ffffff"/>

    <!-- ARC wordmark, monoline geometric, stroke 30 -->
    <g fill="none" stroke="url(#letters)" stroke-width="30" stroke-linejoin="miter" stroke-miterlimit="6">
      <!-- A -->
      <path d="M86 400 L125 262 H135 L174 400"/>
      <path d="M106 352 H154"/>
      <!-- R -->
      <path d="M220 400 V262 H262 A32 32 0 0 1 262 326 H220"/>
      <path d="M258 326 L296 400"/>
      <!-- C -->
      <path d="M424.5 276.4 A61.5 61.5 0 1 0 424.5 370.6"/>
    </g>

    <!-- tiny season mark -->
    <g fill="#7dd3fc" fill-opacity="0.9">
      <rect x="236" y="436" width="40" height="4" rx="2"/>
      <rect x="196" y="436" width="28" height="4" rx="2" fill-opacity="0.35"/>
      <rect x="288" y="436" width="28" height="4" rx="2" fill-opacity="0.35"/>
    </g>
  </g>
</svg>
