<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122038"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a4a"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Ice snowflake in the background (winter) -->
  <g transform="translate(256 256)" stroke="#7dd3fc" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.55" filter="url(#glow)">
    <g id="arm">
      <line x1="0" y1="0" x2="0" y2="-196"/>
      <path d="M0 -150 l-34 -34 M0 -150 l34 -34 M0 -96 l-26 -26 M0 -96 l26 -26"/>
    </g>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
  </g>

  <!-- Bold dumbbell in the foreground (training), diagonal -->
  <g transform="rotate(-35 256 256)">
    <!-- dark outline for contrast -->
    <g fill="#0b1220">
      <rect x="150" y="226" width="212" height="60" rx="14"/>
      <rect x="92" y="176" width="64" height="160" rx="18"/>
      <rect x="356" y="176" width="64" height="160" rx="18"/>
      <rect x="46" y="200" width="52" height="112" rx="16"/>
      <rect x="414" y="200" width="52" height="112" rx="16"/>
    </g>
    <!-- bar -->
    <rect x="160" y="236" width="192" height="40" rx="10" fill="url(#bar)"/>
    <!-- inner plates -->
    <rect x="100" y="184" width="48" height="144" rx="14" fill="url(#plate)"/>
    <rect x="364" y="184" width="48" height="144" rx="14" fill="url(#plate)"/>
    <!-- outer plates -->
    <rect x="54" y="208" width="36" height="96" rx="12" fill="url(#plate)"/>
    <rect x="422" y="208" width="36" height="96" rx="12" fill="url(#plate)"/>
    <!-- highlight on the bar -->
    <rect x="170" y="242" width="172" height="8" rx="4" fill="#ffd0a8" opacity="0.6"/>
  </g>

  <!-- Season tag -->
  <g>
    <rect x="178" y="392" width="156" height="54" rx="16" fill="#7dd3fc"/>
    <text x="256" y="431" text-anchor="middle" font-family="Arial Narrow, Arial, Helvetica, sans-serif" font-weight="900" font-size="38" letter-spacing="2" fill="#0b1220">26/27</text>
  </g>
</svg>
